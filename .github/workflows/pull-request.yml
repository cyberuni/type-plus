name: pull-request
on:
  pull_request:
    types: [opened, synchronize]
  merge_group:

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      # No browser tests in this repo: `packages/type-plus/vitest.config.ts` runs
      # `environment: 'node'` with no browser project, and there are no `*.stories.*`
      # files. The root `playwright` devDependency is not referenced by any config or
      # script. Verified, not assumed.
      skip-playwright: true
